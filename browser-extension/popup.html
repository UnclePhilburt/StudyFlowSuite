<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>StudyFlowSuite</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    body {
      width: 360px;
      min-height: 500px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    .container {
      background: #fff;
      min-height: 500px;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 16px 20px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .header-content {
      position: relative;
      z-index: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .brand-icon img {
      width: 18px;
      height: 18px;
    }

    .brand h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand .version {
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 600;
      margin-left: auto;
    }

    /* Main Content */
    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    /* Settings Section */
    .section {
      margin-bottom: 20px;
    }

    .settings-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .input-group {
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px 14px;
      color: #1e293b;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      outline: none;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .input-group input::placeholder {
      color: #94a3b8;
    }

    .input-hint {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 6px;
      line-height: 1.4;
    }

    .clear-setup-link {
      font-size: 11px;
      color: #dc2626;
      margin-top: 8px;
      cursor: pointer;
      text-decoration: underline;
      transition: color 0.2s;
    }

    .clear-setup-link:hover {
      color: #b91c1c;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .checkbox-wrapper:hover {
      border-color: #667eea;
      background: #f1f5f9;
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .checkbox-wrapper label {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      margin: 0;
    }

    input[type="checkbox"].toggle-input {
      display: none;
    }

    /* Buttons */
    .actions {
      padding: 16px 20px 20px;
      background: #fff;
      border-top: 1px solid #e2e8f0;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #64748b;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-danger {
      background: #fee2e2;
      color: #dc2626;
      margin-top: 8px;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .hidden {
      display: none !important;
    }

    /* User Profile */
    .user-profile {
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 13px;
    }

    .user-details {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-name {
      font-size: 12px;
      font-weight: 600;
      color: #1e293b;
    }

    .user-plan {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .logout-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s;
      font-weight: 500;
    }

    .logout-btn:hover {
      background: #e2e8f0;
      color: #64748b;
    }

    /* Welcome Animation */
    .welcome-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeOut 0.5s ease 2s forwards;
    }

    .welcome-content {
      text-align: center;
      color: white;
      animation: slideUp 0.6s ease;
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      animation: fadeInUp 0.6s ease;
    }

    .welcome-name {
      font-size: 20px;
      font-weight: 600;
      opacity: 0.9;
      animation: fadeInUp 0.6s ease 0.2s backwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        transform: translateY(15px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Loading animation */
    .loading {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      animation: loading 1.4s infinite;
    }

    @keyframes loading {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }

    .loading::before,
    .loading::after {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      animation: loading 1.4s infinite;
    }

    .loading::before {
      margin-right: 4px;
      animation-delay: -0.32s;
    }

    .loading::after {
      margin-left: 4px;
      animation-delay: 0.32s;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-content">
        <div class="brand">
          <div class="brand-icon">
            <img src="icon128.png" alt="StudyFlowSuite">
          </div>
          <h1>StudyFlow</h1>
          <span class="version">v0.2.0</span>
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- Quick Settings -->
      <div class="section">
        <div class="input-group">
          <label>Model Selection</label>
          <select id="aiModel">
            <option value="gpt-4o-mini">Basic Model</option>
            <option value="gpt-4o">Advanced Model (Pro Only)</option>
          </select>
          <div class="input-hint" id="modelHint">Basic: Fast & accurate • Advanced: Maximum accuracy</div>
        </div>
      </div>

      <!-- Settings Grid -->
      <div class="settings-row">
        <div class="input-group">
          <label>Question Limit</label>
          <input type="number" id="totalQuestions" placeholder="Unlimited">
          <div class="input-hint">Stop after N questions</div>
        </div>
        <div class="input-group">
          <label>Target Time (min)</label>
          <input type="number" id="targetTime" placeholder="Auto pace">
          <div class="input-hint">Adds delays</div>
        </div>
      </div>

      <!-- Answer Mode -->
      <div class="section">
        <div class="input-group">
          <label>Answer Mode</label>
          <select id="quizMode">
            <option value="sequential">Sequential - One question per page with auto-navigation</option>
            <option value="multi-question">Multi-Question - Multiple questions per page, manual navigation</option>
            <option value="single-page">Single-Page - All questions on one page</option>
          </select>
          <div class="input-hint">How questions are displayed in your assignment</div>
        </div>
      </div>

    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="startBtn" class="btn btn-primary">
        <span>▶</span>
        <span>Start Assistant</span>
      </button>
      <button id="resumeBtn" class="btn btn-primary hidden">
        <span>▶</span>
        <span>Resume</span>
      </button>
      <button id="stopBtn" class="btn btn-danger hidden">
        <span>■</span>
        <span>Stop Assistant</span>
      </button>
    </div>

    <!-- User Profile -->
    <div class="user-profile" id="userProfile">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-details">
          <span class="user-name" id="userName">Loading...</span>
          <span class="user-plan" id="userPlan">Free Plan</span>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </div>

  <script src="auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
