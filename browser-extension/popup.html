<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>StudyFlowSuite</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    body {
      width: 360px;
      min-height: 500px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    .container {
      background: #fff;
      min-height: 500px;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 24px 20px;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="rgba(255,255,255,0.05)"/></svg>');
      opacity: 0.3;
    }

    .header-content {
      position: relative;
      z-index: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
    }

    .brand-icon img {
      width: 20px;
      height: 20px;
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand .version {
      background: rgba(255, 255, 255, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 600;
      margin-left: auto;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      opacity: 0.9;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-dot.idle {
      background: #94a3b8;
      animation: none;
    }

    .status-dot.error {
      background: #f87171;
    }

    /* Main Content */
    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      transition: all 0.2s;
    }

    .stat:hover {
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #1e293b;
      line-height: 1;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Settings Section */
    .section {
      margin-bottom: 20px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-toggle {
      font-size: 10px;
      color: #94a3b8;
    }

    .section-content {
      display: grid;
      gap: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .section-content.collapsed {
      max-height: 0;
      opacity: 0;
      margin-top: 0;
    }

    .input-group {
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 6px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      color: #1e293b;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      outline: none;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .input-group input::placeholder {
      color: #94a3b8;
    }

    .input-hint {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .checkbox-wrapper:hover {
      border-color: #667eea;
      background: #f1f5f9;
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .checkbox-wrapper label {
      flex: 1;
      font-size: 12px;
      font-weight: 500;
      color: #475569;
      cursor: pointer;
      margin: 0;
    }

    /* Buttons */
    .actions {
      padding: 16px 20px 20px;
      background: #fff;
      border-top: 1px solid #e2e8f0;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 14px rgba(102, 126, 234, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #64748b;
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-danger {
      background: #fee2e2;
      color: #dc2626;
      margin-top: 8px;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .hidden {
      display: none !important;
    }

    /* User Profile */
    .user-profile {
      padding: 16px 20px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .user-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
      color: white;
    }

    .user-plan {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: white;
      font-size: 11px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
      font-weight: 500;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Welcome Animation */
    .welcome-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: fadeOut 0.5s ease 2s forwards;
    }

    .welcome-content {
      text-align: center;
      color: white;
      animation: slideUp 0.6s ease;
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      animation: fadeInUp 0.6s ease;
    }

    .welcome-name {
      font-size: 20px;
      font-weight: 600;
      opacity: 0.9;
      animation: fadeInUp 0.6s ease 0.2s backwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        transform: translateY(15px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Loading animation */
    .loading {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      animation: loading 1.4s infinite;
    }

    @keyframes loading {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }

    .loading::before,
    .loading::after {
      content: '';
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      animation: loading 1.4s infinite;
    }

    .loading::before {
      margin-right: 4px;
      animation-delay: -0.32s;
    }

    .loading::after {
      margin-left: 4px;
      animation-delay: 0.32s;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-content">
        <div class="brand">
          <div class="brand-icon">
            <img src="icon128.png" alt="StudyFlowSuite">
          </div>
          <h1>StudyFlow</h1>
          <span class="version">v0.2.0</span>
        </div>
        <div class="status-bar">
          <div class="status-dot idle" id="statusDot"></div>
          <span id="statusText">Ready to start</span>
        </div>
      </div>
    </div>

    <!-- User Profile -->
    <div class="user-profile" id="userProfile">
      <div class="user-info">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-details">
          <div class="user-name" id="userName">Loading...</div>
          <div class="user-plan" id="userPlan">Free Plan</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>

    <!-- Content -->
    <div class="content">
      <!-- Stats -->
      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="questionCount">0</div>
          <div class="stat-label">Answered</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="errorCount">0</div>
          <div class="stat-label">Errors</div>
        </div>
      </div>

      <!-- Quick Settings -->
      <div class="section">
        <div class="input-group">
          <label>AI Model</label>
          <select id="aiModel">
            <option value="gpt-4o-mini">GPT-4o Mini (Recommended)</option>
            <option value="gpt-4o">GPT-4o (Most Accurate)</option>
          </select>
          <div class="input-hint">Mini: $0.15/1k • Pro: $2.50/1k questions</div>
        </div>
      </div>

      <!-- Advanced Settings -->
      <div class="section">
        <div class="section-header" onclick="toggleSection('advanced')">
          <div class="section-title">Advanced Settings</div>
          <div class="section-toggle" id="advancedToggle">▼</div>
        </div>
        <div class="section-content" id="advancedContent">
          <div class="input-group">
            <label>Question Limit</label>
            <input type="number" id="totalQuestions" placeholder="Unlimited">
            <div class="input-hint">Stop after N questions</div>
          </div>
          <div class="input-group">
            <label>Target Time (minutes)</label>
            <input type="number" id="targetTime" placeholder="Auto pace">
            <div class="input-hint">Adds delays between questions</div>
          </div>
          <div class="checkbox-wrapper">
            <input type="checkbox" id="onePageMode">
            <label for="onePageMode">One-page quiz mode</label>
          </div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="startBtn" class="btn btn-primary">
        <span>▶</span>
        <span>Start Quiz</span>
      </button>
      <button id="resumeBtn" class="btn btn-primary hidden">
        <span>▶</span>
        <span>Resume</span>
      </button>
      <button id="stopBtn" class="btn btn-danger hidden">
        <span>■</span>
        <span>Stop Quiz</span>
      </button>
      <button id="clearSetup" class="btn btn-secondary">
        <span>🗑️</span>
        <span>Clear Site Setup</span>
      </button>
    </div>
  </div>

  <script>
    function toggleSection(id) {
      const content = document.getElementById(id + 'Content');
      const toggle = document.getElementById(id + 'Toggle');
      content.classList.toggle('collapsed');
      toggle.textContent = content.classList.contains('collapsed') ? '▶' : '▼';
    }

    // Start collapsed
    document.getElementById('advancedContent').classList.add('collapsed');
    document.getElementById('advancedToggle').textContent = '▶';
  </script>
  <script src="auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
