<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>StudyFlowSuite</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      margin: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.15));
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: padding-box;
      transition: all 0.3s ease;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.25));
      border-radius: 10px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    ::-webkit-scrollbar-thumb:active {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.35));
    }

    body {
      width: 420px;
      min-height: 600px;
      max-height: 600px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 0;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated background gradient */
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      animation: rotate 20s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .container {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      margin: 16px;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 16px 64px rgba(0, 0, 0, 0.2),
                  inset 0 1px 0 rgba(255, 255, 255, 0.3);
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      position: relative;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.1));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      position: relative;
      overflow: hidden;
    }

    .logo::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0%, 100% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
    }

    .logo img {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      object-fit: cover;
    }

    .title h1 {
      font-size: 26px;
      font-weight: 800;
      color: white;
      letter-spacing: -0.8px;
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.2);
      line-height: 1.2;
    }

    .title p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 4px;
      font-weight: 500;
    }

    .version {
      position: absolute;
      top: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.9);
      font-size: 10px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Settings Card */
    .settings-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .input-group {
      position: relative;
    }

    .input-group label {
      display: block;
      color: rgba(255, 255, 255, 0.8);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px 14px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      transition: all 0.3s ease;
      outline: none;
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
    }

    .input-group input:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
    }

    .input-group input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .input-hint {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      font-weight: 500;
    }

    /* Checkbox styling */
    .checkbox-group {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #00e676;
    }

    .checkbox-group label {
      color: rgba(255, 255, 255, 0.85);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      margin: 0;
      text-transform: none;
      letter-spacing: 0;
    }

    .clear-setup-btn {
      grid-column: 1 / -1;
      background: rgba(255, 82, 82, 0.15);
      border: 1px solid rgba(255, 82, 82, 0.3);
      color: rgba(255, 255, 255, 0.9);
      padding: 8px 16px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }

    .clear-setup-btn:hover {
      background: rgba(255, 82, 82, 0.25);
      border-color: rgba(255, 82, 82, 0.5);
    }

    /* Status Card */
    .status-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .status-card.running {
      background: rgba(255, 193, 7, 0.12);
      border-color: rgba(255, 193, 7, 0.3);
      animation: pulseGlow 2s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 193, 7, 0.3); }
      50% { box-shadow: 0 0 40px rgba(255, 193, 7, 0.5); }
    }

    .status-card.success {
      background: rgba(76, 175, 80, 0.12);
      border-color: rgba(76, 175, 80, 0.3);
    }

    .status-card.idle {
      background: rgba(100, 181, 246, 0.12);
      border-color: rgba(100, 181, 246, 0.3);
    }

    .status-text {
      color: white;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-icon {
      font-size: 18px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 24px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      transition: transform 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-4px);
    }

    .stat-value {
      font-size: 42px;
      font-weight: 800;
      color: white;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      margin-bottom: 8px;
    }

    .stat-value.counting {
      animation: countUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes countUp {
      0% { transform: scale(1.3); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .stat-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 18px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    .btn-start {
      background: linear-gradient(135deg, #00e676 0%, #00c853 100%);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .btn-start:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0, 200, 83, 0.4);
    }

    .btn-stop {
      background: linear-gradient(135deg, #ff5252 0%, #f44336 100%);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .btn-stop:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(244, 67, 54, 0.4);
    }

    .btn span {
      position: relative;
      z-index: 1;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <img src="icon128.png" alt="StudyFlowSuite">
      </div>
      <div class="title">
        <h1>StudyFlowSuite</h1>
        <p>AI-Powered Quiz Assistant</p>
      </div>
      <div class="version">v0.6.0</div>
    </div>

    <!-- Settings Card -->
    <div class="settings-card">
      <div class="settings-grid">
        <div class="input-group">
          <label>Total Questions</label>
          <input type="number" id="totalQuestions" placeholder="Optional" min="1" max="999">
          <div class="input-hint">Leave empty for unlimited</div>
        </div>
        <div class="input-group">
          <label>Target Time (min)</label>
          <input type="number" id="targetTime" placeholder="Optional" min="1" max="999">
          <div class="input-hint">Requires total questions</div>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="onePageMode">
          <label for="onePageMode">One-page quiz mode (all questions on one page)</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="skipEssays">
          <label for="skipEssays">Skip text-based questions (essay/short-answer/fill-in-blank)</label>
        </div>
        <button id="clearSetup" class="clear-setup-btn">🗑️ Clear saved setup for this site</button>
      </div>
    </div>

    <!-- Status Card -->
    <div id="statusCard" class="status-card idle">
      <div class="status-text">
        <span class="status-icon">⚡</span>
        <span id="statusText">Click "Start Quiz" to begin</span>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="questionCount">0</div>
        <div class="stat-label">Questions</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="errorCount">0</div>
        <div class="stat-label">Errors</div>
      </div>
    </div>

    <!-- Action Buttons -->
    <button id="startBtn" class="btn btn-start">
      <span>▶ Start Quiz</span>
    </button>
    <button id="stopBtn" class="btn btn-stop hidden">
      <span>■ Stop Quiz</span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
