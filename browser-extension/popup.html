<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>StudyFlowSuite</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      border-radius: 12px;
      overflow: hidden;
    }

    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #444;
    }

    body {
      width: 380px;
      min-height: 580px;
      max-height: 580px;
      background: #0f0f0f;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 0;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      border-radius: 12px;
    }

    .container {
      background: #1a1a1a;
      padding: 0;
      position: relative;
      border-radius: 12px;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 20px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      border-radius: 12px 12px 0 0;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .title {
      flex: 1;
      margin-left: 12px;
    }

    .title h1 {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .title p {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
      font-weight: 500;
    }

    .version {
      background: #2a2a2a;
      color: #888;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #333;
    }

    /* Settings Card */
    .settings-card {
      background: #1a1a1a;
      padding: 20px;
      margin: 0;
      border-bottom: 1px solid #2a2a2a;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .input-group {
      position: relative;
    }

    .input-group label {
      display: block;
      color: #aaa;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 12px;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s ease;
      outline: none;
    }

    .input-group input::placeholder {
      color: #555;
      font-weight: 400;
    }

    .input-group input:focus {
      background: #0f0f0f;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .input-group input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .input-hint {
      font-size: 9px;
      color: #666;
      margin-top: 4px;
      font-weight: 400;
    }

    /* Checkbox styling */
    .checkbox-group {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 10px;
      background: #0f0f0f;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
    }

    .checkbox-group input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .checkbox-group label {
      color: #ccc;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      margin: 0;
      text-transform: none;
      letter-spacing: 0;
    }

    .clear-setup-btn {
      grid-column: 1 / -1;
      background: #2a2a2a;
      border: 1px solid #333;
      color: #ff6b6b;
      padding: 10px 14px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }

    .clear-setup-btn:hover {
      background: #333;
      border-color: #ff6b6b;
    }

    /* Status Card */
    .status-card {
      background: #1a1a1a;
      padding: 16px 20px;
      margin: 0;
      border-bottom: 1px solid #2a2a2a;
      transition: all 0.3s ease;
    }

    .status-card.running {
      background: linear-gradient(90deg, #1a1a1a 0%, rgba(102, 126, 234, 0.1) 100%);
      border-left: 3px solid #667eea;
    }

    .status-card.success {
      background: linear-gradient(90deg, #1a1a1a 0%, rgba(0, 230, 118, 0.1) 100%);
      border-left: 3px solid #00e676;
    }

    .status-card.idle {
      background: #1a1a1a;
      border-left: 3px solid #333;
    }

    .status-text {
      color: #ccc;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-icon {
      font-size: 16px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 20px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
    }

    .stat-card {
      background: #0f0f0f;
      border-radius: 12px;
      padding: 20px 16px;
      border: 1px solid #2a2a2a;
      text-align: center;
      transition: all 0.2s;
    }

    .stat-card:hover {
      border-color: #667eea;
      background: #1a1a1a;
    }

    .stat-value {
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 6px;
      line-height: 1;
    }

    .stat-value.counting {
      animation: countUp 0.4s ease;
    }

    @keyframes countUp {
      0% { transform: scale(1.2); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .stat-label {
      font-size: 10px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-start {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: 1px solid #667eea;
    }

    .btn-start:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-start:active {
      transform: translateY(0);
    }

    .btn-stop {
      background: #2a2a2a;
      color: #ff6b6b;
      border: 1px solid #333;
    }

    .btn-stop:hover {
      background: #333;
      border-color: #ff6b6b;
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.2);
    }

    .btn span {
      position: relative;
      z-index: 1;
    }

    /* Action Buttons Container */
    .action-buttons {
      padding: 20px;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-radius: 0 0 12px 12px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div style="display: flex; align-items: center;">
        <div class="logo">
          <img src="icon128.png" alt="StudyFlowSuite">
        </div>
        <div class="title">
          <h1>StudyFlowSuite</h1>
          <p>Quiz Assistant</p>
        </div>
      </div>
      <div class="version">v0.0.8</div>
    </div>

    <!-- Settings Card -->
    <div class="settings-card">
      <div class="settings-grid">
        <div class="input-group">
          <label>Total Questions</label>
          <input type="number" id="totalQuestions" placeholder="Optional" min="1" max="999">
          <div class="input-hint">Leave empty for unlimited</div>
        </div>
        <div class="input-group">
          <label>Target Time (min)</label>
          <input type="number" id="targetTime" placeholder="Optional" min="1" max="999">
          <div class="input-hint">Requires total questions</div>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="onePageMode">
          <label for="onePageMode">One-page quiz mode (all questions on one page)</label>
        </div>
        <div class="input-group" style="grid-column: 1 / -1;">
          <label>AI Model</label>
          <select id="aiModel" style="width: 100%; background: #0f0f0f; border: 1px solid #333; border-radius: 8px; padding: 10px 12px; color: #fff; font-size: 13px; font-weight: 500; font-family: 'Inter', sans-serif; cursor: pointer;">
            <option value="gemini-2.5-flash">Gemini 2.5 Flash (Recommended - Fast & Cheap)</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro (Best Accuracy)</option>
          </select>
          <div class="input-hint">2.5 Flash: $0.03/1k questions | 2.5 Pro: $1/1k questions</div>
        </div>
        <button id="clearSetup" class="clear-setup-btn">🗑️ Clear saved setup for this site</button>
      </div>
    </div>

    <!-- Status Card -->
    <div id="statusCard" class="status-card idle">
      <div class="status-text">
        <span class="status-icon">⚡</span>
        <span id="statusText">Click "Start Quiz" to begin</span>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="questionCount">0</div>
        <div class="stat-label">Questions</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="errorCount">0</div>
        <div class="stat-label">Errors</div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button id="startBtn" class="btn btn-start">
        <span>▶ Start Quiz</span>
      </button>
      <button id="resumeBtn" class="btn btn-start hidden">
        <span>▶ Resume Quiz</span>
      </button>
      <button id="stopBtn" class="btn btn-stop hidden">
        <span>■ Stop Quiz</span>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
